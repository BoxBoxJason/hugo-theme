# Starting point for the documentation site of a repository: copy it to docs/hugo.toml
# and replace every occurrence of "my-project".
baseURL = "https://boxboxjason.github.io/my-project/"
title = "my-project"
locale = "en-US"

# "Last updated" dates on pages come from git history, so CI must check out all of it.
enableGitInfo = true
enableRobotsTXT = true

# Hugo does not merge `markup` from a theme: keep this block in every site.
[markup]
  [markup.highlight]
    noClasses = false

# Look and feel (colours, favicon, footer, search, ...) come from the shared theme.
[module]
  [[module.imports]]
    path = "github.com/boxboxjason/hugo-theme"

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Search"
    weight = 2
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 3
    url = "https://github.com/boxboxjason/my-project"
    [menu.main.params]
      icon = "github"

[params]
  # Home page meta description and search result snippet: 50 to 160 characters.
  description = "my-project does one thing well: say what, for whom, in one sentence."
  # Social preview (1200x630), generated with tools/social-card.mjs. No leading slash.
  images = ["images/social.png"]
  # Optional: the token of a Google Search Console "HTML tag" verification.
  # googleSiteVerification = "..."
  # Structured data (JSON-LD) for the home page.
  [params.project]
    repository = "https://github.com/boxboxjason/my-project"
    license = "https://opensource.org/license/mit"
    programmingLanguage = "Go"
  [params.editURL]
    base = "https://github.com/boxboxjason/my-project/edit/main/docs/content"
