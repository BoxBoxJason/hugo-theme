# Shared configuration, merged into the configuration of every site importing this theme.
# A site can override any of it from its own hugo.toml.

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[params]
  [params.brand]
    name = "BoxBoxJason"
    homeURL = "https://github.com/boxboxjason"
  [params.navbar]
    displayTitle = true
    displayLogo = false
  [params.footer]
    displayCopyright = false
    displayPoweredBy = false
  [params.editURL]
    enable = true
  [params.search]
    enable = true
    type = "flexsearch"
  [params.theme]
    default = "system"
    displayToggle = true
